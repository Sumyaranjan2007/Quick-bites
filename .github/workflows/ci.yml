name: Quick Bite Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Platform Architecture & Compliance Diagnostics
        run: node scripts/diagnostics.js

      - name: Monorepo Build & Typecheck (Turborepo)
        run: npm run build

      - name: Execute Full Integration & Unit Test Matrix
        run: npm run test

      - name: Verify Docker Compose Configuration Syntax
        run: docker compose config
