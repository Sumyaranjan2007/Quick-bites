name: Quick Bite Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The backend runs its tests and seed through Node's native TypeScript
      # stripping (`node --experimental-strip-types src/**/*.ts`), which only
      # exists from Node 22.6. On Node 20 the flag is rejected outright with
      # "bad option", so every run failed before a single test executed.
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Platform Architecture & Compliance Diagnostics
        run: node scripts/diagnostics.js

      - name: Monorepo Build & Typecheck (Turborepo)
        run: npm run build

      - name: Execute Full Integration & Unit Test Matrix
        run: npm run test

      - name: Verify Docker Compose Configuration Syntax
        run: docker compose config
