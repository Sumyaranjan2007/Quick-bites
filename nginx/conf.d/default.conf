# Quick Bite Nginx Edge Reverse Proxy Configuration

upstream backend_cluster {
    server backend-api:5000;
    keepalive 32;
}

upstream partner_cluster {
    server restaurant-web:80;
    keepalive 16;
}

upstream admin_cluster {
    server admin-web:80;
    keepalive 16;
}

# HTTP Default Server (Port 80)
server {
    listen 80;
    server_name localhost quickbite.local *.quickbite.local;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # Max Request Payload (1MB for general JSON API requests)
    client_max_body_size 10M;

    # 1. API Gateway Routing
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 2. Global Health Check Probe
    location /health {
        proxy_pass http://backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Real-Time WebSockets (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend_cluster/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Partner Web Portal
    location /partner/ {
        proxy_pass http://partner_cluster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. Admin Operations Control Tower
    location /admin/ {
        proxy_pass http://admin_cluster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. Default Fallback
    location / {
        proxy_pass http://partner_cluster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
