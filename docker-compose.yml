version: '3.8'

services:
  # 1. PostgreSQL 15 with PostGIS extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: quickbites-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: quickbites
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickbites"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickbites-network

  # 2. Redis Key-Value & Rate Limiting Cache
  redis:
    image: redis:7-alpine
    container_name: quickbites-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickbites-network

  # 3. Meilisearch Fast Catalog Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: quickbites-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey123SampleForLocalDev
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - quickbites-network

  # 4. Quick Bite Core Backend API & Real-Time Engine
  backend-api:
    build:
      context: .
      dockerfile: apps/backend-api/Dockerfile
    container_name: quickbites-backend-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DEMO_MODE: "true"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/quickbites?schema=public"
      REDIS_URL: "redis://redis:6379"
      MEILISEARCH_HOST: "http://meilisearch:7700"
      MEILISEARCH_API_KEY: "masterKey123SampleForLocalDev"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quickbites-network

  # 5. Restaurant Partner Web Portal
  restaurant-web:
    build:
      context: .
      dockerfile: apps/restaurant-web/Dockerfile
    container_name: quickbites-restaurant-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend-api
    networks:
      - quickbites-network

  # 6. Admin Operations Control Tower
  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: quickbites-admin-web
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend-api
    networks:
      - quickbites-network

  # 7. Edge Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: quickbites-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend-api
      - restaurant-web
      - admin-web
    networks:
      - quickbites-network

volumes:
  postgres_data:
  meilisearch_data:

networks:
  quickbites-network:
    driver: bridge
